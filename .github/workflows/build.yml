name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            cmake_args: ""
            pluginval_zip: pluginval_Windows.zip
            pluginval_bin: ./pluginval.exe
          - name: macOS
            os: macos-latest
            cmake_args: -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
            pluginval_zip: pluginval_macOS.zip
            pluginval_bin: ./pluginval.app/Contents/MacOS/pluginval

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        shell: bash
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release ${{ matrix.cmake_args }}

      - name: Build
        shell: bash
        run: cmake --build build --config Release --parallel 4

      - name: Run tests
        shell: bash
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Validate the VST3 with pluginval
        shell: bash
        run: |
          curl -sSL -o pluginval.zip "https://github.com/Tracktion/pluginval/releases/download/v1.0.4/${{ matrix.pluginval_zip }}"
          unzip -q pluginval.zip
          ${{ matrix.pluginval_bin }} --strictness-level 5 --skip-gui-tests --validate-in-process \
            --validate "build/FuzzyFilter_artefacts/Release/VST3/Fuzzy Filter.vst3"

      # Mac: sign the bundles ad hoc (no Apple account needed yet), check the
      # AU with Apple's validator the way Logic does, and zip each bundle with
      # ditto so the download keeps its permissions and signature.
      - name: Sign, validate and package (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          out=build/FuzzyFilter_artefacts/Release
          codesign --force --deep --sign - "$out/AU/Fuzzy Filter.component"
          codesign --force --deep --sign - "$out/VST3/Fuzzy Filter.vst3"
          codesign --force --deep --sign - "$out/AAX/Fuzzy Filter.aaxplugin"
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R "$out/AU/Fuzzy Filter.component" ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar || true
          auval -v aufx Fzf1 Fzfl
          mkdir -p package
          ditto -c -k --keepParent "$out/AU/Fuzzy Filter.component" "package/Fuzzy Filter AU.zip"
          ditto -c -k --keepParent "$out/VST3/Fuzzy Filter.vst3" "package/Fuzzy Filter VST3.zip"
          ditto -c -k --keepParent "$out/AAX/Fuzzy Filter.aaxplugin" "package/Fuzzy Filter AAX (unsigned).zip"

      - name: Upload VST3 (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: FuzzyFilter-Windows-VST3
          path: build/FuzzyFilter_artefacts/Release/VST3/

      - name: Upload AAX (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: FuzzyFilter-Windows-AAX-unsigned
          path: build/FuzzyFilter_artefacts/Release/AAX/

      - name: Upload AU, VST3 and AAX (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: FuzzyFilter-macOS
          path: package/
